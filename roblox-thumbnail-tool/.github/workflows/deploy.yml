name: Deploy to Vercel — Roblox Thumbnail Engine

# ──────────────────────────────────────────────────────────────────────────────
# Deploys the Next.js app to Vercel on push to main.
# For GitHub Pages static export, see README.md for the alternative config.
# ──────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  # ── Quality Gate ─────────────────────────────────────────────────────────────
  quality:
    name: TypeCheck + Lint + Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test -- --run
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/roblox_test"
          UPSTASH_REDIS_REST_URL: "https://mock.upstash.io"
          UPSTASH_REDIS_REST_TOKEN: "mock-token"

  # ── Vercel Production Deploy ──────────────────────────────────────────────────
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20

    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Deploy via Vercel CLI
        id: deploy
        run: |
          npm install -g vercel@latest
          URL=$(vercel --prod --token ${{ secrets.VERCEL_TOKEN }} \
            --env DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            --env POSTGRES_PRISMA_URL="${{ secrets.POSTGRES_PRISMA_URL }}" \
            --env POSTGRES_URL_NON_POOLING="${{ secrets.POSTGRES_URL_NON_POOLING }}" \
            --env UPSTASH_REDIS_REST_URL="${{ secrets.UPSTASH_REDIS_REST_URL }}" \
            --env UPSTASH_REDIS_REST_TOKEN="${{ secrets.UPSTASH_REDIS_REST_TOKEN }}" \
            --env CRON_SECRET="${{ secrets.CRON_SECRET }}" \
            --env APP_SECRET="${{ secrets.APP_SECRET }}" \
            --env STORAGE_PROVIDER="${{ vars.STORAGE_PROVIDER }}" \
            --yes 2>&1 | tail -n 1)
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Comment deployment URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Preview deployed**: ${{ steps.deploy.outputs.url }}`
            })
